[project]
name = "eventlog"
version = "0.1.0"
description = "A small event logging library with pluggable storage"
requires-python = ">=3.9"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eventlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
